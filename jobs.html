<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs — HireFlow</title>
  <meta name="description" content="Browse IT jobs on HireFlow. Search and filter technology roles by location, technology, experience, salary, job type and work mode.">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="header"></div>
  <div id="navbar"></div>

  <!-- ========================= PAGE HERO ========================= -->
  <section class="page-hero">
    <div class="container">
      <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Home</a></li><li class="breadcrumb-item active" aria-current="page">Jobs</li></ol></nav>
      <h1>Browse Jobs</h1>
      <p class="lead">Explore technology roles from top companies. Filter to find your perfect match.</p>
    </div>
  </section>

  <!-- ========================= JOB MARKETPLACE ========================= -->
  <section class="section">
    <div class="container">

      <!-- Filter bar -->
      <div class="filter-bar">
        <button id="filterToggle" class="btn btn-ghost btn-sm filter-toggle d-lg-none" type="button" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
          Filters
        </button>

        <div id="filterBody" class="filter-body">
          <div class="row g-3">
            <div class="col-lg-4">
              <label class="form-label" for="jobSearch">Search</label>
              <div class="search-suggest">
                <input type="text" id="jobSearch" class="form-control" placeholder="Job title, skill or company…" autocomplete="off">
              </div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
              <label class="form-label" for="locationSearch">Location</label>
              <input type="text" id="locationSearch" class="form-control" placeholder="City or Remote">
            </div>
            <div class="col-6 col-md-4 col-lg-2">
              <label class="form-label" for="filterCategory">Technology</label>
              <select id="filterCategory" class="form-select">
                <option value="all">All Tech</option>
                <option value="software">Software Development</option>
                <option value="cloud">Cloud &amp; DevOps</option>
                <option value="data">Data &amp; AI</option>
                <option value="qa">QA &amp; Testing</option>
                <option value="uiux">UI/UX</option>
              </select>
            </div>
            <div class="col-6 col-md-4 col-lg-1">
              <label class="form-label" for="filterExperience">Experience</label>
              <select id="filterExperience" class="form-select">
                <option value="all">Any</option>
                <option value="entry">Entry</option>
                <option value="mid">Mid</option>
                <option value="senior">Senior</option>
                <option value="lead">Lead</option>
              </select>
            </div>
            <div class="col-6 col-md-4 col-lg-1">
              <label class="form-label" for="filterSalary">Salary</label>
              <select id="filterSalary" class="form-select">
                <option value="all">Any</option>
                <option value="0-100">&lt; $100k</option>
                <option value="100-140">$100k – $140k</option>
                <option value="140-300">$140k+</option>
              </select>
            </div>
            <div class="col-6 col-md-4 col-lg-1">
              <label class="form-label" for="filterType">Job Type</label>
              <select id="filterType" class="form-select">
                <option value="all">All</option>
                <option value="full-time">Full-time</option>
                <option value="contract">Contract</option>
                <option value="part-time">Part-time</option>
              </select>
            </div>
            <div class="col-6 col-md-4 col-lg-1">
              <label class="form-label" for="filterMode">Work Mode</label>
              <select id="filterMode" class="form-select">
                <option value="all">All</option>
                <option value="onsite">Onsite</option>
                <option value="hybrid">Hybrid</option>
                <option value="remote">Remote</option>
              </select>
            </div>
          </div>
        </div>

        <div class="filter-bar-bottom">
          <p class="text-muted mb-0">Showing <strong id="resultCount">0</strong> jobs</p>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <label class="form-label mb-0 me-1" for="sortJobs">Sort</label>
            <select id="sortJobs" class="form-select sort-select">
              <option value="newest">Newest</option>
              <option value="salary-desc">Salary: High to Low</option>
              <option value="salary-asc">Salary: Low to High</option>
              <option value="title">Title: A–Z</option>
            </select>
            <button type="button" id="resetFilters" class="btn btn-ghost btn-sm">Reset</button>
          </div>
        </div>
      </div>

      <!-- Job grid -->
      <div id="jobGrid" class="row g-4 mt-4"></div>

      <div id="noResults" class="no-results text-center" style="display:none;">
        <div class="icon-badge mx-auto mb-3"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
        <h4>No matching jobs found</h4>
        <p class="text-muted">Try adjusting your filters or search keywords.</p>
      </div>

    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/jquery/jquery.min.js"></script>
  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/jobs-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
